<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title data-i18n="extName"></title>
<style>
  body { margin: 0; padding: 14px 16px; width: 320px; font: 13px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; color: #111; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #202020; } .hint { color: #aaa !important; } select { background: #333; color: #eee; } }
  h1 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(128,128,128,.2); }
  .row:last-of-type { border-bottom: none; }
  .row label { flex: 1; }
  .hint { color: #666; font-size: 11px; margin-top: 2px; }
  select, input[type=number] { font: inherit; padding: 2px 4px; max-width: 190px; }
  input[type=number] { width: 52px; }
  .keys { margin-top: 12px; font-size: 12px; }
  a { color: #1a73e8; cursor: pointer; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""><span data-i18n="extName"></span></h1>

  <div class="row">
    <label for="autoplay"><span data-i18n="optAutoplay"></span><div class="hint" data-i18n="optAutoplayHint"></div></label>
    <input type="checkbox" id="autoplay">
  </div>
  <div class="row">
    <label for="direction" data-i18n="optDirection"></label>
    <select id="direction">
      <option value="newer" data-i18n="dirNewer"></option>
      <option value="older" data-i18n="dirOlder"></option>
    </select>
  </div>
  <div class="row">
    <label for="delay"><span data-i18n="optDelay"></span><div class="hint" data-i18n="optDelayHint"></div></label>
    <input type="number" id="delay" min="0" max="30" step="1">
  </div>
  <div class="row">
    <label for="includeShorts"><span data-i18n="optShorts"></span><div class="hint" data-i18n="optShortsHint"></div></label>
    <input type="checkbox" id="includeShorts">
  </div>
  <div class="row">
    <label for="showPanel" data-i18n="optPanel"></label>
    <input type="checkbox" id="showPanel">
  </div>

  <div class="keys">
    <span data-i18n="keysText"></span> <a id="shortcuts" data-i18n="changeShortcuts"></a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
